# Subquery Cache Load Test Configuration
# Purpose: Test subquery cache correctness and performance on beta
#
# Test scenarios:
# 1. Stable series (main workload) — cache should be fully warm
# 2. Series churn — cache should detect and invalidate
# 3. Query shadow — compare cached results against non-cached for correctness
#
# How to run:
# 1. Upload this file to s3://aws-prometheus-load-test-config/subquery-cache-test.yaml
# 2. Monitor ruler logs for "subquery cache:" messages
# 3. Use query shadow to validate correctness (compare Thanos vs Prometheus engine results)
# 4. After testing, delete the config file from S3 to stop

- region: us-west-2
  domain: beta
  cell: 5  # <-- CHANGE THIS to an available beta cell

  # --- Data Generation ---
  workspaces: 1
  workspacesAliasPrefix: sq-cache-test
  metricsPerWorkspace: 100
  activeSeriesPerMetricName: 1000  # 100 metrics × 1000 series = 100K active series
  extraLabels: 5
  metricNameSize: 20
  labelNameSize: 15
  labelValueSize: 15
  remoteWriteInterval: 15000  # 15s scrape interval
  remoteWriteBatchSize: 500
  preDefinedLabels:
    - name: pod
      values: ['pod-0', 'pod-1', 'pod-2', 'pod-3', 'pod-4', 'pod-5', 'pod-6', 'pod-7', 'pod-8', 'pod-9']
    - name: namespace
      values: ['ns-a', 'ns-b', 'ns-c']
    - name: cluster
      values: ['cluster-1', 'cluster-2']
  funcMap:
    - func: ramp_1h
      weight: 10
    - func: sin_10m
      weight: 5
    - func: rand
      weight: 2

  # --- Series Churn (tests cache invalidation) ---
  # 1% of series churn every write interval (15s)
  # This means ~1000 series change every 15s
  # Cache should detect and cold-start when this happens
  churnRate: 0.01

  # --- Rule Groups (tests subquery cache on ruler path) ---
  ruleGroupNamespace: "sq-cache-test-ns"
  durationInMinutes: -1  # run forever until config deleted
  ruleGroupCreationDelayInSeconds: 120  # wait for data to populate
  ruleGroups:
    # Group 1: Subqueries with different functions on SAME inner expression
    # These should SHARE cache entries (same inner expression fingerprint)
    - namePrefix: "shared-cache"
      interval: 60s
      rules:
        - expr: "max_over_time(sum by (namespace) (metric_0_metric_0_metric_)[10m:1m])"
          type: record
          repeat: 1
        - expr: "min_over_time(sum by (namespace) (metric_0_metric_0_metric_)[10m:1m])"
          type: record
          repeat: 1
        - expr: "avg_over_time(sum by (namespace) (metric_0_metric_0_metric_)[10m:1m])"
          type: record
          repeat: 1

    # Group 2: Long-range subqueries (high cache benefit)
    - namePrefix: "long-range"
      interval: 60s
      rules:
        - expr: "max_over_time(sum by (cluster) (rate(metric_1_metric_1_metric_[5m]))[1h:1m])"
          type: record
          repeat: 1
        - expr: "avg_over_time(sum by (cluster) (rate(metric_1_metric_1_metric_[5m]))[30m:1m])"
          type: record
          repeat: 1

    # Group 3: High cardinality subqueries (tests maxCacheableSeriesPerStep)
    - namePrefix: "high-cardinality"
      interval: 60s
      rules:
        - expr: "max_over_time(rate(metric_2_metric_2_metric_[5m])[10m:1m])"
          type: record
          repeat: 1

    # Group 4: Short range (tests minStepsToCache threshold)
    - namePrefix: "short-range"
      interval: 60s
      rules:
        - expr: "max_over_time(metric_3_metric_3_metric_[2m:1m])"
          type: record
          repeat: 1

    # Group 5: Duplicate queries (same expr in different groups, tests cross-rule sharing)
    - namePrefix: "duplicate-a"
      interval: 60s
      rules:
        - expr: "sum_over_time(sum by (namespace) (metric_4_metric_4_metric_)[15m:1m])"
          type: record
          repeat: 1
    - namePrefix: "duplicate-b"
      interval: 60s
      rules:
        - expr: "sum_over_time(sum by (namespace) (metric_4_metric_4_metric_)[15m:1m])"
          type: record
          repeat: 1

  # --- Queries (for query shadow / correctness validation) ---
  # These queries go through QFE. Use query shadow to compare engine results.
  queries:
    # Subquery queries (same as ruler rules, but via query path)
    "query?query=max_over_time(sum by (namespace) (metric_0_metric_0_metric_)[10m:1m])&time=-1m": 0.1
    "query?query=avg_over_time(sum by (cluster) (rate(metric_1_metric_1_metric_[5m]))[30m:1m])&time=-1m": 0.1
    # Range query version (for comparison — not cached by subquery cache)
    "query_range?query=sum by (namespace) (rate(metric_0_metric_0_metric_[5m]))&start=-30m&end=-1m&step=60": 0.05
